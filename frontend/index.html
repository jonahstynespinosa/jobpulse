<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobPulse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="bg-jp-surface border-b border-jp-border px-6 flex items-center justify-between h-14 sticky top-0 z-10">
  <div class="text-lg font-bold text-jp-accent tracking-tight">Job<span class="text-jp-text">Pulse</span></div>
  <div class="flex gap-5 text-xs text-jp-muted" id="statsBar">Loading...</div>
</header>

<div class="max-w-4xl mx-auto px-4 py-6">

  <div class="flex gap-2.5 mb-5 flex-wrap">
    <input id="search" type="text" placeholder="Search jobs, companies, skills..." class="flex-1 min-w-[200px]" />
    <select id="sourceFilter">
      <option value="">All sources</option>
      <option value="remotive">Remotive</option>
      <option value="arbeitnow">Arbeitnow</option>
      <option value="hn_hiring">HN Hiring</option>
    </select>
    <button onclick="fetchJobs(0)" class="btn-primary">Search</button>
    <button onclick="triggerIngest()" id="ingestBtn" class="btn-secondary">Run Ingestion</button>
  </div>

  <div class="ingest-status" id="ingestStatus"></div>

  <div class="flex items-center justify-between mb-3.5 text-jp-muted text-xs">
    <span id="resultCount">—</span>
    <span id="lastUpdated"></span>
  </div>

  <div class="flex flex-col gap-2.5" id="jobList">
    <div class="state-message">Loading jobs<span class="spinner"></span></div>
  </div>

  <div class="flex justify-center items-center gap-3 mt-6 text-jp-muted text-xs" id="pagination"></div>

</div>

<script>
  const API = '';
  let currentOffset = 0;
  const LIMIT = 50;

  async function fetchStats() {
    try {
      const r = await fetch(`${API}/api/stats`);
      const data = await r.json();
      const parts = Object.entries(data.by_source)
        .map(([s, c]) => `<strong class="text-jp-text">${c}</strong> ${s}`)
        .join(' · ');
      document.getElementById('statsBar').innerHTML =
        `<strong class="text-jp-text">${data.total_jobs}</strong> total &nbsp;|&nbsp; ${parts || 'No data yet'}`;
    } catch {
      document.getElementById('statsBar').textContent = 'Stats unavailable';
    }
  }

  async function fetchJobs(offset = 0) {
    currentOffset = offset;
    const q = document.getElementById('search').value.trim();
    const source = document.getElementById('sourceFilter').value;
    const params = new URLSearchParams({ limit: LIMIT, offset });
    if (q) params.set('q', q);
    if (source) params.set('source', source);

    document.getElementById('jobList').innerHTML =
      '<div class="state-message">Loading jobs<span class="spinner"></span></div>';

    try {
      const r = await fetch(`${API}/api/jobs?${params}`);
      const data = await r.json();
      renderJobs(data.jobs, data.total, offset);
      renderPagination(data.total, offset);
    } catch {
      document.getElementById('jobList').innerHTML =
        '<div class="state-message">Failed to load jobs. Is the server running?</div>';
    }
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso)) / 1000;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function renderJobs(jobs, total, offset) {
    document.getElementById('resultCount').textContent =
      `${total} jobs found · showing ${offset + 1}–${Math.min(offset + LIMIT, total)}`;

    if (!jobs.length) {
      document.getElementById('jobList').innerHTML =
        '<div class="state-message">No jobs found. Try running ingestion or adjusting filters.</div>';
      return;
    }

    document.getElementById('jobList').innerHTML = jobs.map(j => {
      const tags = (j.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 5);
      return `
        <div class="job-card">
          <div>
            <a class="job-title" href="${j.url}" target="_blank" rel="noopener">${escHtml(j.title)}</a>
            <div class="job-meta">
              <span>🏢 ${escHtml(j.company)}</span>
              <span>📍 ${escHtml(j.location)}</span>
              ${j.posted_at ? `<span>🕐 ${timeAgo(j.posted_at)}</span>` : ''}
            </div>
            ${tags.length ? `<div class="job-tags">${tags.map(t => `<span class="job-tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
          </div>
          <div class="job-right">
            <span class="badge ${j.source}">${j.source}</span>
            <span class="text-jp-muted text-[11px]">${timeAgo(j.ingested_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  function renderPagination(total, offset) {
    const pg = document.getElementById('pagination');
    const hasPrev = offset > 0;
    const hasNext = offset + LIMIT < total;
    if (!hasPrev && !hasNext) { pg.innerHTML = ''; return; }
    pg.innerHTML = `
      <button class="btn-secondary" onclick="fetchJobs(${offset - LIMIT})" ${hasPrev ? '' : 'disabled'}>← Prev</button>
      <span>Page ${Math.floor(offset / LIMIT) + 1} / ${Math.ceil(total / LIMIT)}</span>
      <button class="btn-secondary" onclick="fetchJobs(${offset + LIMIT})" ${hasNext ? '' : 'disabled'}>Next →</button>`;
  }

  async function triggerIngest() {
    const btn = document.getElementById('ingestBtn');
    const status = document.getElementById('ingestStatus');
    btn.disabled = true;
    btn.textContent = 'Ingesting...';
    status.className = 'ingest-status running';
    status.textContent = 'Running ingestion pipeline — this may take 30–60 seconds...';

    try {
      const r = await fetch(`${API}/api/ingest`, { method: 'POST' });
      const data = await r.json();
      const summary = Object.entries(data.results)
        .map(([src, r]) => `${src}: +${r.added} new (${r.fetched} fetched)`)
        .join(' · ');
      status.className = 'ingest-status success';
      status.textContent = `✓ Ingestion complete — ${summary}`;
      fetchJobs(0);
      fetchStats();
    } catch {
      status.className = 'ingest-status error';
      status.textContent = 'Ingestion failed. Check the server logs.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Run Ingestion';
    }
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('search').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchJobs(0);
  });

  fetchStats();
  fetchJobs(0);
</script>
</body>
</html>
